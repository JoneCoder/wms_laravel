version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wms_laravel_app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: wms_laravel_db
    environment:
      - POSTGRES_DB=${DB_DATABASE:-wms}
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secret}
    volumes:
      - pgsql_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wms_laravel_redis
    volumes:
      - redis_data:/data

volumes:
  pgsql_data:
  redis_data:
